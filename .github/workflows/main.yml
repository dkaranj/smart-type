
name: Build Smart Type for Windows

"on":
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Smart Type EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name SmartType --collect-all google.genai --collect-all keyring smart_type.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: SmartType-Windows
          path: dist/SmartType.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SmartType.exe
          generate_release_notes: true

